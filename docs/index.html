 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Design Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

/* REMOVE OLD BACKGROUND */
body{
    color:#fff;
    overflow-x:hidden;
}

/* 🎬 VIDEO BACKGROUND */
#bgVideo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

/* DARK OVERLAY */
.video-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    z-index:-1;
}

nav{
    position:fixed;
    width:100%;
    padding:20px 50px;
    display:flex;
    justify-content:space-between;
    z-index:1000;
    backdrop-filter:blur(10px);
}

.logo{
    font-weight:900;
    font-size:24px;
}

.hero{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    flex-direction:column;
}

.hero h1{
    font-size:70px;
}

.hero span{
    color:#ff4d6d;
}

.hero p{
    margin-top:20px;
    color:#aaa;
}

.btn{
    margin-top:15px;
    padding:15px 40px;
    background:#ff4d6d;
    border:none;
    color:#fff;
    cursor:pointer;
    font-weight:bold;
    text-decoration:none;
}

.btn:hover{
    transform:scale(1.1);
}

/* BENTO */
.bento{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    padding:80px;
}

.box{
    position:relative;
    padding:20px;
    border-radius:20px;
    min-height:220px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background-size:cover;
    background-position:center;
    overflow:hidden;
}

.box::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.box h2{
    z-index:2;
    margin-bottom:10px;
}

.mini-gallery{
    display:flex;
    gap:10px;
    z-index:2;
}

.mini-gallery img{
    width:60px;
    height:60px;
    border-radius:10px;
    object-fit:cover;
}

.logo-box{ background-image:url("logo-bg.jpg"); }
.flyer-box{ background-image:url("flyer-bg.jpg"); }
.brand-box{ background-image:url("brand-bg.jpg"); }
.mockup-box{ background-image:url("mockup-bg.jpg"); }

.portfolio{
    padding:80px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.gallery img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:15px;
}

.contact{
    padding:80px;
    text-align:center;
}

input, textarea{
    width:300px;
    padding:10px;
    margin:10px;
    border-radius:10px;
}

.card3d{
    width:300px;
    height:200px;
    background:#111;
    margin:50px auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:20px;
}
</style>
</head>

<body>

<!-- 🎬 VIDEO -->
<video autoplay muted loop playsinline id="bgVideo">
    <source src="bg.mp4" type="video/mp4">
</video>

<div class="video-overlay"></div>

<nav>
<div class="logo">ER8NY</div>
</nav>

<section class="hero">
<h1>Create <span>Bold</span> Designs</h1>
<p>Logos • Flyers • Branding • 3D</p>

<a href="https://wa.me/2347044455969" class="btn">Order on WhatsApp</a>

<button onclick="payNow()" class="btn">Pay Now</button>
</section>

<div class="card3d"><h2>3D Experience</h2></div>

<section class="bento">

<div class="box logo-box">
<h2>Logo Design</h2>
<div class="mini-gallery">
<img src="logo1.jpg">
<img src="logo2.jpg">
</div>
</div>

<div class="box flyer-box">
<h2>Flyer Design</h2>
<div class="mini-gallery">
<img src="flyer1.jpg">
<img src="flyer2.jpg">
</div>
</div>

<div class="box brand-box">
<h2>Brand Identity</h2>
<div class="mini-gallery">
<img src="brand1.jpg">
<img src="brand2.jpg">
</div>
</div>

<div class="box mockup-box">
<h2>3D Mockups</h2>
<div class="mini-gallery">
<img src="mockup1.jpg">
<img src="mockup2.jpg">
</div>
</div>

</section>

<section class="portfolio">
<h2>My Work</h2>

<div class="gallery">
<img src="fashion.jpg">
<img src="salon.jpg">
<img src="travel.jpg">
<img src="street.jpg">
</div>

</section>

<section class="contact">
<h2>Contact</h2>

<form action="https://formspree.io/f/xzdykdqa" method="POST">
<input type="text" placeholder="Name">
<input type="email" placeholder="Email">
<textarea placeholder="Message"></textarea>
<button class="btn">Send</button>
</form>

</section>

<!-- PAYSTACK -->
<script src="https://js.paystack.co/v1/inline.js"></script>

<script>
function payNow(){
    PaystackPop.setup({
        key: "pk_test_f4569e34805e433049db5cde60edaeb9dd38d95b",
        email: "your@email.com",
        amount: 9000000,
        currency: "NGN",
        callback: function(response){
            alert("Payment successful! Ref: " + response.reference);
        },
        onClose: function(){
            alert("Transaction cancelled");
        }
    }).openIframe();
}
</script>

</body>
</html>
